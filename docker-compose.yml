services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cmf}
      POSTGRES_USER:     ${POSTGRES_USER:-cmf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmf}
      TZ:                America/Santiago
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmf} -d ${POSTGRES_DB:-cmf}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST:     db
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       ${POSTGRES_DB:-cmf}
      POSTGRES_USER:     ${POSTGRES_USER:-cmf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmf}
      # SMTP y mailing
      CMF_SMTP_HOST:              ${CMF_SMTP_HOST:-}
      CMF_SMTP_PORT:              ${CMF_SMTP_PORT:-587}
      CMF_SMTP_USER:              ${CMF_SMTP_USER:-}
      CMF_SMTP_PASS:              ${CMF_SMTP_PASS:-}
      CMF_SMTP_TLS:               ${CMF_SMTP_TLS:-starttls}
      CMF_MAIL_FROM:              ${CMF_MAIL_FROM:-}
      CMF_MAIL_TO_NUEVAS:         ${CMF_MAIL_TO_NUEVAS:-}
      CMF_MAIL_TO_ASIGNADOS:      ${CMF_MAIL_TO_ASIGNADOS:-}
      CMF_MAIL_SUBJECT_NUEVAS:    ${CMF_MAIL_SUBJECT_NUEVAS:-}
      CMF_MAIL_SUBJECT_ASIGNADOS: ${CMF_MAIL_SUBJECT_ASIGNADOS:-}
      CMF_DASHBOARD_URL:          ${CMF_DASHBOARD_URL:-http://localhost:8080/}
    volumes:
      # 'reports' lo lee nginx; tambien expone data/ por si quieres respaldar
      # los JSON originales mientras pruebas la migracion.
      - reports:/app/reports
      - ./data:/app/data:ro
    healthcheck:
      # Sano si la ultima corrida exitosa registrada en meta.ultima_corrida
      # fue hoy o ayer. start_period=10m da margen al primer arranque
      # (espera DB + migracion + primera corrida del pipeline).
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 1h
      timeout: 15s
      retries: 3
      start_period: 10m

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - reports:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/dashboard.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db_data:
  reports:
